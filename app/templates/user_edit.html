{% extends "base.html" %}

{% block title %}编辑参与者 - 开发组任务登记及志愿时长分配系统{% endblock %}

{% block content %}
    <div class="body">
        <div class="container">
            <div class="container-header">
                <h2>编辑参与者</h2>
            </div>
            <form id="edit-user-form" onsubmit="submitEditUserForm(); return false;" data-original-username="{{ user.username }}">
                <label for="username">修改后的参与者名：</label>
                <textarea id="username" name="username" rows="2" placeholder="原名：{{ user.username }}"></textarea>
                <button type="submit" id="submit">提交</button>
            </form>
            <div id="result"></div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='user_edit.js') }}"></script>
    <script src="{{ url_for('static', filename='warning_unsaved.js') }}"></script>
{% endblock %}
