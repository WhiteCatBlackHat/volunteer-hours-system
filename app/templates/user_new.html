{% extends "base.html" %}

{% block title %}新建参与者 - 开发组任务登记及志愿时长分配系统{% endblock %}

{% block content %}
    <div class="body">
        <div class="container">
            <div class="container-header">
                <h2>新建参与者</h2>
            </div>
            <form id="user-form" onsubmit="submitUserForm(); return false;">
                <label for="username">参与者名称（每行一个）：</label>
                <textarea id="username" name="username" rows="5" required></textarea>
                <button type="submit" id="submit">提交</button>
            </form>
            <div id="result"></div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='user_new.js') }}"></script>
    <script src="{{ url_for('static', filename='warning_unsaved.js') }}"></script>
{% endblock %}
