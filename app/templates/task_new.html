{% extends "base.html" %}

{% block title %}新建任务 - 开发组任务登记及志愿时长分配系统{% endblock %}

{% block content %}
    <div class="body">
        <div class="container" id="task-container">
            <div class="container-header">
                <h2>新建任务</h2>
            </div>
            <form id="task-form" onsubmit="submitTaskForm(); return false;">
                <p>
                    <label for="task-name">任务名称：</label>
                    <input type="text" id="task-name" name="task_name" required>
                </p>
                <p>
                    <label for="task-hours">志愿时长（小时）：</label>
                    <input type="number" id="task-hours" name="task_hours" min="0" max="10000" step="0.1" required>
                </p>
                <p>
                    <label for="task-start-time">任务开始时间：</label>
                    <input type="datetime-local" id="task-start-time" name="task_start_time" required>
                </p>
                <p>
                    <label for="task-end-time">任务结束时间：</label>
                    <input type="datetime-local" id="task-end-time" name="task_end_time" required>
                </p>
                <label for="task-description">任务描述：</label>
                <textarea id="task-description" name="task_description" rows="5" required></textarea>
                <label for="username">参与者名称（每行一个）：</label>
                <textarea id="username" name="username" rows="5" required></textarea>
                <button type="submit" id="submit">提交</button>
            </form>
            <div id="result"></div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='task_new.js') }}"></script>
    <script src="{{ url_for('static', filename='warning_unsaved.js') }}"></script>
{% endblock %}
